<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello Kitty Premium Gallery - For My Muse</title>

    <!-- 优雅的英文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- MediaPipe AI 手势库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        /* ====== 高级感 Hello Kitty 柔粉主题 ====== */
        :root {
            --bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #FDE4E9 50%, #FCD2DB 100%);
            --kitty-pink: #FF9EAB;
            --rose-gold: #D4A3B3;
            --text-dark: #5A3A42;
            --text-light: #8A656E;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            color: var(--text-dark);
        }

        /* 隐秘的高级感：背景微弱的呼吸光晕 */
        .ambient-light {
            position: absolute; top: 30%; left: 50%; width: 90vw; height: 90vw;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255,255,255,0) 60%);
            transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
            animation: pulseLight 6s infinite alternate;
        }
        @keyframes pulseLight {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* ====== 欢迎/播放控制页 ====== */
        #intro-screen {
            position: fixed; inset: 0; background: var(--bg-gradient);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 1s ease, visibility 1s;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; }
        
        .kitty-bow-svg {
            width: 60px; height: 60px; margin-bottom: 20px;
            fill: var(--kitty-pink); filter: drop-shadow(0 4px 8px rgba(255, 158, 171, 0.4));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .enter-btn {
            padding: 12px 36px; border-radius: 30px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
            color: var(--text-dark); font-family: 'Playfair Display', serif;
            font-size: 18px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(212, 163, 179, 0.2);
            margin-top: 30px; letter-spacing: 2px;
        }
        .enter-btn:hover { background: #fff; box-shadow: 0 10px 25px rgba(212, 163, 179, 0.4); transform: scale(1.05); }

        /* ====== 顶部文案区 ====== */
        .header {
            position: absolute; top: 8%; width: 100%; text-align: center; z-index: 10;
        }
        .header h1 {
            font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600;
            letter-spacing: 2px; color: var(--text-dark); margin: 0 0 5px 0;
        }
        .header p {
            font-size: 13px; font-weight: 500; letter-spacing: 2px; color: var(--text-light); margin: 0;
        }

        /* ====== 画廊容器 (与暗黑版相同，但颜色调整) ====== */
        .gallery-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; z-index: 5;
        }

        .card {
            position: absolute; width: 65vw; max-width: 320px; aspect-ratio: 3 / 4;
            border-radius: 16px; background-size: cover; background-position: center;
            /* 玫瑰金质感阴影与纯白边框 */
            box-shadow: 0 20px 40px rgba(212, 163, 179, 0.4);
            border: 6px solid #FFF; 
            transition: all 0.7s cubic-bezier(0.25, 1, 0.2, 1);
            cursor: pointer; -webkit-user-select: none;
        }

        /* 卡片状态 */
        .card.active { transform: translateX(0) translateZ(0) scale(1); z-index: 10; opacity: 1; }
        .card.prev { transform: translateX(-40vw) translateZ(-200px) rotateY(15deg); z-index: 5; filter: blur(2px) contrast(0.8); opacity: 0.7; pointer-events: none; }
        .card.next { transform: translateX(40vw) translateZ(-200px) rotateY(-15deg); z-index: 5; filter: blur(2px) contrast(0.8); opacity: 0.7; pointer-events: none; }
        .card.hidden-left { transform: translateX(-80vw) translateZ(-400px); z-index: 1; opacity: 0; pointer-events: none; }
        .card.hidden-right { transform: translateX(80vw) translateZ(-400px); z-index: 1; opacity: 0; pointer-events: none; }

        /* ====== 抽取放大模态框 ====== */
        .zoom-modal {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.85);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 999;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: opacity 0.5s cubic-bezier(0.25, 1, 0.2, 1);
        }
        .zoom-modal.active { opacity: 1; pointer-events: auto; }
        
        .zoom-img {
            max-width: 90vw; max-height: 85vh; border-radius: 12px;
            box-shadow: 0 15px 50px rgba(212, 163, 179, 0.5); border: 8px solid #fff;
            transform: scale(0.8) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.2, 1);
        }
        .zoom-modal.active .zoom-img { transform: scale(1) translateY(0); }

        /* 极简玫瑰金镜头圈 */
        #camera-wrapper {
            position: fixed; bottom: 25px; right: 25px;
            width: 55px; height: 55px; border-radius: 50%; overflow: hidden;
            border: 2px solid var(--rose-gold); z-index: 100;
            box-shadow: 0 4px 15px rgba(212, 163, 179, 0.5); background: #fff;
        }
        .input_video { display: none; }
        .output_canvas { width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
        
        #status-tip {
            position: fixed; bottom: 35px; width: 100%; text-align: center;
            font-size: 13px; color: var(--text-light); z-index: 10;
            letter-spacing: 1px; pointer-events: none; font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 🎵 背景音乐：Gotta Have You - The Weepies -->
    <audio id="bg-music" src="./The Weepies、Deb Talan、Steve Tannen - Gotta Have You.flac" loop></audio>

    <!-- 🌸 欢迎开启页：解决浏览器不能自动播放音乐的问题，增加仪式感 -->
    <div id="intro-screen">
        <!-- 极简线条的高级感 Kitty 蝴蝶结 SVG -->
        <svg class="kitty-bow-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 60 C40 60, 35 50, 35 45 C35 40, 45 40, 50 45 C55 40, 65 40, 65 45 C65 50, 60 60, 50 60 Z" />
            <path d="M38 46 C20 30, 10 35, 15 55 C20 75, 35 70, 42 55 Z" />
            <path d="M62 46 C80 30, 90 35, 85 55 C80 75, 65 70, 58 55 Z" />
            <circle cx="50" cy="48" r="7" fill="#fff"/>
        </svg>
        <div class="header" style="position: relative; top: 0;">
            <h1 style="color: var(--text-dark);">Hello Kitty · Muse</h1>
            <p style="color: var(--text-light);">专属高定画廊</p>
        </div>
        <button class="enter-btn" onclick="startExperience()">轻轻开启</button>
    </div>

    <div class="ambient-light"></div>

    <div class="header">
        <h1>To My Muse</h1>
        <p>Gotta Have You · 女神节快乐灵灵</p>
    </div>

    <!-- 画廊容器 -->
    <div class="gallery-container" id="gallery"></div>

    <div id="status-tip">AI 加载中... </div>

    <!-- 抽取放大全屏容器 -->
    <div class="zoom-modal" id="zoom-modal" onclick="closeZoomFallback()">
        <img src="" class="zoom-img" id="zoom-img">
    </div>

    <!-- 摄像头隐蔽小窗 -->
    <div id="camera-wrapper">
        <video class="input_video"></video>
        <canvas class="output_canvas" width="160" height="160"></canvas>
    </div>

    <script>
        // ==========================================
        // 🌟 核心照片配置 🌟
        // ==========================================
        const PHOTOS =[
            "./9.jpg",
            "./10.jpg",
            "./1.jpg",
            "./8.jpg",
            "./4.jpg",
            "./5.jpg",
            "./6.jpg",
            "./7.jpg",
            "./2.jpg",
            "./3.jpg"
        ];
        
        // ==========================================
        // 音乐与开启仪式逻辑
        // ==========================================
        function startExperience() {
            // 播放音乐
            const music = document.getElementById('bg-music');
            music.volume = 0.6; // 稍微调低音量显得高级
            music.play().catch(e => console.log("音乐播放可能被阻止", e));
            
            // 隐藏欢迎页
            document.getElementById('intro-screen').classList.add('hidden');
        }

        // ==========================================
        // 画廊轮播逻辑
        // ==========================================
        let currentIndex = 0;
        const gallery = document.getElementById('gallery');
        const cards =[];

        PHOTOS.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.backgroundImage = `url(${src})`;
            div.onclick = () => {
                if(index === currentIndex) openZoom();
                else if(index > currentIndex) nextImage();
                else prevImage();
            };
            gallery.appendChild(div);
            cards.push(div);
        });

        function updateGallery() {
            cards.forEach((card, index) => {
                card.className = 'card';
                if (index === currentIndex) card.classList.add('active');
                else if (index === currentIndex - 1) card.classList.add('prev');
                else if (index === currentIndex + 1) card.classList.add('next');
                else if (index < currentIndex - 1) card.classList.add('hidden-left');
                else if (index > currentIndex + 1) card.classList.add('hidden-right');
            });
        }
        updateGallery();

        function nextImage() { if (currentIndex < cards.length - 1 && !isZoomed) { currentIndex++; updateGallery(); } }
        function prevImage() { if (currentIndex > 0 && !isZoomed) { currentIndex--; updateGallery(); } }

        // ==========================================
        // 放大抽取逻辑
        // ==========================================
        const zoomModal = document.getElementById('zoom-modal');
        const zoomImg = document.getElementById('zoom-img');
        let isZoomed = false;

        function openZoom() {
            if (isZoomed) return;
            zoomImg.src = PHOTOS[currentIndex];
            zoomModal.classList.add('active');
            isZoomed = true;
            document.getElementById('status-tip').innerText = "✨ 张开手掌即可放回原处";
        }

        function closeZoom() {
            if (!isZoomed) return;
            zoomModal.classList.remove('active');
            isZoomed = false;
            document.getElementById('status-tip').innerText = "✋ 左右挥手切换照片 | 🤏 双指捏合抽取放大";
        }
        function closeZoomFallback() { closeZoom(); }

        // ==========================================
        // AI 手势识别核心逻辑 (保持原版强大功能)
        // ==========================================
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const statusTip = document.getElementById('status-tip');
        let anchorX = null;
        let lastSwipeTime = 0;

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const thumb = hand[4]; const index = hand[8];
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

                if (pinchDist < 0.05 && !isZoomed) openZoom();
                else if (pinchDist > 0.1 && isZoomed) closeZoom();

                const palmX = hand[9].x;
                const now = Date.now();
                if (anchorX === null) anchorX = palmX;

                if (!isZoomed) {
                    if (now - lastSwipeTime > 800) {
                        const deltaX = palmX - anchorX;
                        if (deltaX < -0.15) { nextImage(); anchorX = palmX; lastSwipeTime = now; } 
                        else if (deltaX > 0.15) { prevImage(); anchorX = palmX; lastSwipeTime = now; }
                    } else {
                        anchorX = palmX;
                    }
                }
            } else { anchorX = null; }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 160, height: 160
        });
        
        camera.start().then(() => {
            statusTip.innerText = "✋ 左右移动手掌切换照片 | 🤏 双指捏合抽取放大";
        }).catch(err => {
            statusTip.innerText = "❌ 未获取到摄像头权限，您仍可触屏滑动操作";
        });

        // ==========================================
        // 手机端触摸滑动兜底兼容
        // ==========================================
        let touchStartX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            if(isZoomed) return;
            const touchEndX = e.changedTouches[0].screenX;
            if(touchEndX < touchStartX - 50) nextImage();
            if(touchEndX > touchStartX + 50) prevImage();
        });
    </script>
</body>
</html>
